name: Verify Docker development environment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  development:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task dev:build
      - run: task dev:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-tests-${{ matrix.runner }}
          path: artifacts/tests.xml
          if-no-files-found: error
