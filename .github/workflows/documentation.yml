name: Reporter documentation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      replay_tag:
        description: Existing published stable tag at current main, for Pages delivery only
        required: true
        type: string
permissions:
  contents: read
jobs:
  version:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release-candidate.yml@v9.9.2
    with:
      replay-tag: ${{ inputs.replay_tag || '' }}
  manual:
    needs: version
    if: >-
      !cancelled() &&
      ((github.event_name == 'pull_request' &&
        (needs.version.result == 'success' ||
         (github.base_ref != 'main' && needs.version.result == 'skipped'))) ||
       (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        needs.version.result == 'success' &&
        inputs.replay_tag == format('v{0}', needs.version.outputs.semver-version) &&
        needs.version.outputs.commit == github.sha &&
        needs.version.outputs.run-id == github.run_id &&
        needs.version.outputs.run-attempt == github.run_attempt))
    permissions:
      contents: read
    uses: ./.github/workflows/documentation-build.yml
    with:
      version: ${{ needs.version.outputs.semver-version }}
      package_version: ${{ needs.version.outputs.pep440-version }}
      release_tag: ${{ inputs.replay_tag || '' }}
      commit: ${{ needs.version.outputs.commit || github.event.pull_request.head.sha }}
      run: ${{ needs.version.outputs.run-id || github.run_id }}
      attempt: ${{ needs.version.outputs.run-attempt || github.run_attempt }}
  deploy-manual:
    needs: [version, manual]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.replay_tag == format('v{0}', needs.version.outputs.semver-version) &&
      needs.version.outputs.commit == github.sha &&
      needs.version.outputs.run-id == github.run_id &&
      needs.version.outputs.run-attempt == github.run_attempt &&
      needs.manual.outputs.artifact-id != '' &&
      needs.manual.outputs.digest != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/documentation-deploy.yml
    with:
      release_tag: ${{ inputs.replay_tag }}
      version: ${{ needs.version.outputs.semver-version }}
      commit: ${{ needs.version.outputs.commit }}
      run: ${{ needs.version.outputs.run-id }}
      attempt: ${{ needs.version.outputs.run-attempt }}
      artifact_id: ${{ needs.manual.outputs.artifact-id }}
      digest: ${{ needs.manual.outputs.digest }}
