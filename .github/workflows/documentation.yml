name: Reporter documentation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.12.23'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task setup
      - run: task verify
      - run: task docs:prepare
      - run: task test:features
      - run: task docs
        if: ${{ !cancelled() }}
      - run: task test:docs
        if: ${{ !cancelled() }}
      - name: Individual installed scenarios and manual checks
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Reporter documentation scenarios and checks
          path: artifacts/feature-tests.xml,artifacts/docs-tests.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Evidence context
        if: ${{ !cancelled() }}
        run: |
          echo 'Four named installed reporter scenarios; not exhaustive feature coverage. No line coverage measured.' >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: ${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Documentation preview and raw JUnit are retained for 14 days below. Browser and independent review remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reporter-documentation-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/docs/html/
            artifacts/docs/source/
            artifacts/docs/wheels/
            artifacts/*tests.xml
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: artifacts/docs/html
  deploy:
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: reporter-pages-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main inside deployment lock
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$CANDIDATE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped superseded documentation revision.' >> "$GITHUB_STEP_SUMMARY"
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        if: steps.freshness.outputs.current == 'true'
