name: Verify, package and release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task setup
      - run: task verify
      - name: Individual tests in run summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Reporter tests (${{ matrix.architecture }})
          path: artifacts/tests.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Individual test check and annotations
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Reporter tests (${{ matrix.architecture }})
          path: artifacts/tests.xml
          reporter: python-xunit
          use-actions-summary: 'false'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporter-tests-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/tests.xml
          if-no-files-found: error
      - run: task package
        env:
          VERSION: 0.0.0
      - run: task smoke
        env:
          VERSION: 0.0.0
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: packages-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Package evidence
        run: |
          echo 'Wheel, source distribution, architecture-independent Debian package and installed-package Docker image passed clean installation checks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Normal image entrypoint and shell override were tested separately. Packages and SHA256SUMS are in the run artifacts.' >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v2.1.0
  publish:
    needs: release
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task setup
      - run: task package
      - run: task smoke
      - name: Attach packages before attempting registry publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.architecture }}" = amd64 ]; then
            gh release upload "$RELEASE_TAG" dist/*.whl dist/livingproof*.tar.gz dist/*.deb dist/requirements.txt
          fi
          gh release upload "$RELEASE_TAG" "dist/image-${{ matrix.architecture }}.tar" "dist/wheelhouse-${{ matrix.architecture }}.tar.gz" "dist/SHA256SUMS-${{ matrix.architecture }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packages-${{ needs.release.outputs.version }}-${{ matrix.architecture }}
          path: dist/
      - name: Publish exact version through the repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/living-proof-labs/livingproof-capability-report:$VERSION-${{ matrix.architecture }}"
          docker logout ghcr.io
  manifest:
    needs: [release, publish]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish one versioned multi-architecture manifest
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/living-proof-labs/livingproof-capability-report
          docker manifest create "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker manifest push "$image:$VERSION"
          docker logout ghcr.io
      - name: Attach combined public checksums
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS-*'
          cat SHA256SUMS-amd64 SHA256SUMS-arm64 > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY"
  verify-registry:
    needs: [release, manifest]
    if: needs.release.outputs.published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Anonymous native pull and command smoke
        run: |
          image=ghcr.io/living-proof-labs/livingproof-capability-report
          docker pull "$image:$VERSION"
          test "$(docker image inspect "$image:$VERSION" --format '{{.Architecture}}')" = "${{ matrix.architecture }}"
          docker run --rm "$image:$VERSION" --version
          docker run --rm --entrypoint /bin/sh "$image:$VERSION" -c 'livingproof-capability-report --help'
          echo "Native ${{ matrix.architecture }} anonymous consumption passed for $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Test the same published all.deb on native distribution runtimes
        run: |
          mkdir downloaded
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          curl -fsSL "$base/livingproof-capability-report_${VERSION}_all.deb" -o downloaded/report.deb
          curl -fsSL "$base/SHA256SUMS" -o downloaded/SHA256SUMS
          mv downloaded/report.deb "downloaded/livingproof-capability-report_${VERSION}_all.deb"
          (cd downloaded && sha256sum --ignore-missing -c SHA256SUMS)
          curl -fsSL https://github.com/Living-Proof-Labs/capability-verifier/releases/download/v1.1.1/report.json -o downloaded/report.json
          for distro in ubuntu:24.04 debian:12-slim debian:13-slim; do
            docker run --rm -v "$PWD/downloaded:/packages:ro" "$distro" sh -ec '
              apt-get update -qq
              apt-get install -y /packages/*_all.deb
              livingproof-capability-report --version
              livingproof-capability-report render /packages/report.json --format json -o /tmp/copy.json
              python3 -c "import json; assert len(json.load(open(\"/tmp/copy.json\"))[\"decisions\"]) == 8"
            '
          done
