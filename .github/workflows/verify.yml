name: Verify, package and release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task setup
      - run: task verify
      - name: Individual tests in run summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Reporter tests (${{ matrix.architecture }})
          path: artifacts/tests.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - name: Individual test check and annotations
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: Reporter tests (${{ matrix.architecture }})
          path: artifacts/tests.xml
          reporter: python-xunit
          use-actions-summary: 'false'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporter-tests-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: artifacts/
          if-no-files-found: error
      - run: task package
        env:
          VERSION: 0.0.0
      - run: task smoke
        env:
          VERSION: 0.0.0
          RUNNER_LABEL: ${{ matrix.runner }}
      - name: Generated compatibility evidence
        if: ${{ !cancelled() }}
        run: uv run --locked --no-sync python tools/compatibility_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: packages-${{ matrix.architecture }}-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: dist/
          if-no-files-found: error
      - name: Package evidence
        run: |
          echo 'Wheel, source distribution, architecture-independent Debian package and installed-package Docker image passed clean installation checks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Normal image entrypoint and shell override were tested separately. Packages and SHA256SUMS are in the run artifacts.' >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v3.0.0
    with:
      draft-release: true
  publish:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: task setup
      - run: task package
      - run: task smoke
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
      - name: Generated release compatibility evidence
        if: ${{ !cancelled() }}
        run: uv run --locked --no-sync python tools/compatibility_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Record exact CI-tested local image identity
        run: docker image inspect "ghcr.io/living-proof-labs/livingproof-capability-report:$VERSION-${{ matrix.architecture }}" --format '{{.Id}}' > "dist/image-id-${{ matrix.architecture }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-packages-${{ needs.release.outputs.version }}-${{ matrix.architecture }}
          retention-days: 14
          path: dist/
      - name: Publish exact version through the repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/living-proof-labs/livingproof-capability-report:$VERSION-${{ matrix.architecture }}"
          docker logout ghcr.io
  manifest:
    needs: [release, publish]
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - name: Publish one versioned multi-architecture manifest
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/living-proof-labs/livingproof-capability-report
          docker manifest create "$image:$VERSION" "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          docker manifest push "$image:$VERSION"
          docker logout ghcr.io
      - name: Resolve anonymous registry manifest
        run: python3 tools/registry_release.py resolve "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-${{ needs.release.outputs.version }}
          retention-days: 14
          path: registry.json
          if-no-files-found: error
  verify-registry:
    needs: [release, manifest]
    if: needs.release.outputs.draft-created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-${{ needs.release.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.release.outputs.version }}-${{ matrix.architecture }}
          path: native
      - name: Anonymous immutable native pull and installed-package smoke
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          image=ghcr.io/living-proof-labs/livingproof-capability-report
          digest=$(python3 -c 'import json; print(json.load(open("registry.json"))["manifest_digest"])')
          reference="$image@$digest"
          docker pull --platform "linux/${{ matrix.architecture }}" "$reference"
          test "$(docker image inspect "$reference" --format '{{.Architecture}}')" = "${{ matrix.architecture }}"
          test "$(docker image inspect "$reference" --format '{{.Id}}')" = "$(cat native/image-id-${{ matrix.architecture }}.txt)"
          docker run --rm "$reference" --version | grep -F "$VERSION"
          docker run --rm --entrypoint /bin/sh "$reference" -c 'livingproof-capability-report --help && python -m pip check'
          docker run --rm --entrypoint python "$reference" -c 'import importlib.metadata as m, sys; assert m.version("livingproof-capability-report") == sys.argv[1]; print({n:m.version(n) for n in ("livingproof-capability-report", "livingproof-common", "click", "jsonschema")})' "$VERSION"
          echo "Native ${{ matrix.architecture }} anonymous immutable consumption passed for $reference; local image ID equals the exact CI-tested image." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.release.outputs.version }}-amd64
          path: downloaded
      - name: Test the same candidate all.deb on native distribution runtimes
        run: |
          (cd downloaded && sha256sum --ignore-missing -c SHA256SUMS-amd64)
          curl -fsSL https://github.com/Living-Proof-Labs/capability-verifier/releases/download/v1.1.1/report.json -o downloaded/report.json
          for distro in ubuntu:24.04 debian:12-slim debian:13-slim; do
            docker run --rm -v "$PWD/downloaded:/packages:ro" "$distro" sh -ec '
              apt-get update -qq
              apt-get install -y /packages/*_all.deb
              livingproof-capability-report --version
              livingproof-capability-report render /packages/report.json > /tmp/table.txt
              grep -q "Separate contexts" /tmp/table.txt
              livingproof-capability-report render /packages/report.json --format json -o /tmp/copy.json
              python3 -c "import json; assert len(json.load(open(\"/tmp/copy.json\"))[\"decisions\"]) == 8"
            '
          done
  publish-release:
    needs: [release, verify-registry]
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.release.outputs.version }}-amd64
          path: downloaded
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-${{ needs.release.outputs.version }}-arm64
          path: arm64
      - name: Stage non-image packages and public checksums
        run: |
          cp arm64/wheelhouse-arm64.tar.gz arm64/compatibility-arm64.json arm64/compatibility-arm64.md downloaded/
          python3 tools/release_assets.py downloaded public
      - name: Attach verified packages
        run: gh release upload "$RELEASE_TAG" public/* --repo "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@v4
        with:
          name: registry-${{ needs.release.outputs.version }}
      - name: Append verified immutable image instructions
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 tools/registry_release.py notes registry.json >> notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Publish tested draft with all assets attached
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Verify anonymous release asset download
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          curl -fsSL "$base/SHA256SUMS" -o SHA256SUMS
          curl -fsSL "$base/livingproof-capability-report_${version}_all.deb" -o "livingproof-capability-report_${version}_all.deb"
          curl -fsSL "$base/compatibility-arm64.json" -o compatibility-arm64.json
          curl -fsSL "$base/compatibility-amd64.json" -o compatibility-amd64.json
          sha256sum --ignore-missing -c SHA256SUMS
