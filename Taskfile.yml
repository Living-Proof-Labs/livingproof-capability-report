# SPDX-License-Identifier: Apache-2.0
# Requires uv, project Python, pyproject.toml, and uv.lock with Ruff/pytest in dev.
version: '3'

tasks:
  setup:
    desc: Sync locked dependencies into the project environment
    cmds:
      - uv sync --locked --no-python-downloads
  check:
    desc: Check Python with locked Ruff
    cmds:
      - uv run --locked --no-sync --no-python-downloads ruff check .
  test:
    desc: Run locked pytest tests --ignore=tests/features --ignore=tests/docs --junitxml=artifacts/tests.xml
    cmds:
      - uv run --locked --no-sync --no-python-downloads pytest tests --ignore=tests/features --ignore=tests/docs --junitxml=artifacts/tests.xml
  verify:
    desc: Run checks and tests
    cmds:
      - task: check
      - task: test
  package:
    desc: Build installed Python, Ubuntu Debian and Docker deliverables
    cmds:
      - uv run --locked --no-sync python tools/package.py
  smoke:
    desc: Check installations without mounting a source checkout
    cmds:
      - uv run --locked --no-sync python tools/smoke.py
  dev:build:
    platforms: [linux]
    desc: Build the shared Docker development target
    cmds:
      - docker compose build development
  dev:verify:
    platforms: [linux]
    desc: Run setup and verification in the development image without nested Docker
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" development bash -c 'task setup && task verify'
  dev:shell:
    platforms: [linux]
    desc: Open the development image and set up its environment
    interactive: true
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" development bash -c 'task setup && exec bash'

  docs:prepare:
    desc: Build and install the documentation candidate wheel
    cmds:
      - uv run --locked --no-sync python tools/docs.py prepare
  test:features:
    desc: Exercise four named installed reporter scenarios
    cmds:
      - uv run --locked --no-sync pytest tests/features --junitxml=artifacts/feature-tests.xml
  docs:
    desc: Render Markdown and installed Click references with observed results
    cmds:
      - uv run --locked --no-sync python tools/docs.py build
  test:docs:
    desc: Check generated navigation, references, provenance and local links
    cmds:
      - uv run --locked --no-sync pytest tests/docs --junitxml=artifacts/docs-tests.xml
  docs:verify:
    desc: Build and verify installed scenarios and the manual
    cmds:
      - task: docs:prepare
      - task: test:features
      - task: docs
      - task: test:docs

  dev:docs:
    platforms: [linux]
    desc: Verify the manual in the shared Docker development environment
    cmds:
      - docker compose run --rm --user "$(id -u):$(id -g)" development bash -c 'task setup && task docs:verify'
