site_name: Living Proof Labs capability reporter
site_url: https://docs.livingprooflabs.com/livingproof-capability-report/
use_directory_urls: false
strict: true
theme:
  name: zensical
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      toggle: {icon: lucide/sun-moon, name: Switch to light mode}
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle: {icon: lucide/sun, name: Switch to dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle: {icon: lucide/moon, name: Switch to system preference}
markdown_extensions:
  - mkdocs-click
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences
