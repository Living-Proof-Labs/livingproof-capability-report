[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0", "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl#sha256=8b7795748b54eeb89610f3716245f45db48ac0474465a5abbf974e7075c1476c"]
build-backend = "hatchling.build"

[project]
name = "livingproof-capability-report"
dynamic = ["version"]
description = "Portable evidence and capability reports for Living Proof Labs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["livingproof-common==1.0.0", "click>=8.1,<9", "jsonschema>=4.10,<5"]

[project.scripts]
livingproof-capability-report = "livingproof_capability_report.cli:report"

[project.entry-points."livingproof.capability.commands"]
report = "livingproof_capability_report.cli:report"

[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2", "build==1.3.0", "zensical==0.0.73", "mkdocs-click==0.9.0"]

[tool.pytest.ini_options]
addopts = "-ra"
[tool.ruff]
line-length = 100

[tool.uv.sources]
livingproof-common = { url = "https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl" }
